<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f223f" />
      <stop offset="50%" stop-color="#091325" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="pulseTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="25" y="25" width="450" height="450" rx="96" fill="url(#bgGrad)" stroke="url(#glowBorder)" stroke-width="4"/>

  <!-- Cross & Pulse -->
  <g transform="translate(250, 210)">
    <!-- Medical Cross -->
    <path d="M-25,-90 h50 v65 h65 v50 h-65 v65 h-50 v-65 h-65 v-50 h65 z" fill="#0d2b4a" stroke="#14b8a6" stroke-width="3" opacity="0.6"/>
    <!-- ECG Heartbeat Line -->
    <path d="M-170,0 L-90,0 L-60,-45 L-30,55 L0,-70 L30,45 L60,-20 L90,0 L170,0" fill="none" stroke="url(#pulseTeal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Branding Text -->
  <text x="250" y="380" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">Soli Medical</text>
  <rect x="210" y="405" width="80" height="28" rx="14" fill="#0d2b4a" stroke="#14b8a6" stroke-width="1.8"/>
  <text x="250" y="424" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#22d3ee" letter-spacing="2">MICU</text>
  <text x="250" y="455" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">INTENSIVE CARE UNIT</text>
</svg>
