<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient for Badge -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f223f"/>
      <stop offset="50%" stop-color="#091325"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>

    <!-- Outer Glow Border -->
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glowing Heartbeat Neon Pulse Line -->
    <linearGradient id="pulseTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Letter S Gradient -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Letter M Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Inner divider subtle line -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#00e5ff" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="250" cy="210" r="190" fill="#14b8a6" opacity="0.1" filter="url(#softGlow)"/>

  <!-- Main Logo Squircle Badge Container (25, 25 to 475, 475) -->
  <g filter="url(#badgeShadow)">
    <rect x="25" y="25" width="450" height="450" rx="96" fill="url(#bgGrad)" stroke="url(#glowBorder)" stroke-width="3.5"/>
  </g>

  <!-- Subtle Hospital Telemetry Cross & Grid motif inside badge -->
  <g opacity="0.12">
    <line x1="250" y1="40" x2="250" y2="350" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="45" y1="185" x2="455" y2="185" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="250" cy="185" r="140" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 4"/>
  </g>

  <!-- ENLARGED GLYPH: S & M touching the top, left, right boundaries -->
  <g id="sm-monogram">
    <!-- Letter 'S' -->
    <path d="M 205 68 C 160 48, 70 60, 60 128 C 50 190, 195 198, 185 272 C 176 342, 92 355, 58 318" fill="none" stroke="url(#sGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity="0.96"/>

    <!-- Letter 'M' -->
    <path d="M 242 345 V 58 L 344 218 L 446 58 V 345" fill="none" stroke="url(#mGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

    <!-- Intertwined Glowing ECG Telemetry Heartbeat Wave -->
    <path d="M 32 200 H 125 L 152 142 L 178 268 L 214 90 L 245 338 L 278 126 L 305 246 L 335 180 L 362 200 H 468" fill="none" stroke="url(#pulseTeal)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonPulse)"/>

    <!-- Dynamic Pulse Glowing Nodes -->
    <circle cx="245" cy="338" r="8" fill="#ffffff" filter="url(#neonPulse)"/>
    <circle cx="214" cy="90" r="6" fill="#ffffff" filter="url(#neonPulse)"/>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="375" x2="440" y2="375" stroke="url(#lineGrad)" stroke-width="1.8"/>

  <!-- Text INSIDE the badge at the bottom: "Soli Medical MICU" -->
  <g text-anchor="middle">
    <g transform="translate(250, 416)">
      <text x="-44" y="6" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="0.8" fill="#ffffff">Soli Medical</text>
      <rect x="52" y="-19" width="86" height="32" rx="16" fill="#0d2b4a" stroke="#14b8a6" stroke-width="1.8"/>
      <text x="95" y="3" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" letter-spacing="2.2" fill="#22d3ee">MICU</text>
    </g>
    <text x="250" y="452" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.4" fill="#64748b">INTENSIVE CARE UNIT</text>
  </g>
</svg>
