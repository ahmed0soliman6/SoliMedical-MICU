name: Deploy Backend to Cloud Run

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker --quiet

      - name: Build and Push Container
        run: |
          IMAGE_NAME="gcr.io/${{ secrets.GCP_PROJECT_ID }}/soli-icu-sync-backend:${{ github.sha }}"
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: soli-icu-sync-backend
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/soli-icu-sync-backend:${{ github.sha }}
          region: ${{ secrets.GCP_REGION || 'us-central1' }}
          flags: '--allow-unauthenticated --port=3000'
          env_vars: |
            NODE_ENV=production
